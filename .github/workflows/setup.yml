name: Auto Setup and Build

on:
  push:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client, push schema, and seed
        run: npm run setup
      - name: Build
        run: npm run build
